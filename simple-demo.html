<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jai Club Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial; background: #111; color: #fff; }
    
    .header { background: #1a1a2e; padding: 15px; display: flex; justify-content: space-between; }
    .logo { color: gold; font-weight: bold; }
    .bal { background: #333; padding: 5px 15px; border-radius: 20px; }
    
    .tabs { display: flex; background: #1a1a2e; padding: 10px; gap: 10px; overflow-x: auto; }
    .tab { padding: 8px 15px; background: #333; border-radius: 20px; cursor: pointer; white-space: nowrap; }
    .tab.on { background: gold; color: #000; }
    
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 15px; }
    .card { background: #222; padding: 20px; text-align: center; border-radius: 10px; cursor: pointer; }
    .card:hover { background: #333; }
    .card .ico { font-size: 30px; }
    
    .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a2e; display: flex; }
    .nav div { flex: 1; text-align: center; padding: 10px; cursor: pointer; }
    .nav div.on { color: gold; }
    
    .screen { display: none; }
    .screen.on { display: block; }
    
    .ghead { background: #1a1a2e; padding: 15px; display: flex; justify-content: space-between; }
    .back { cursor: pointer; font-size: 20px; }
    .timer { text-align: center; font-size: 50px; color: gold; padding: 20px; }
    .btns { display: flex; gap: 10px; padding: 15px; }
    .btns button { flex: 1; padding: 15px; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; }
    .go { width: calc(100% - 30px); margin: 15px; padding: 15px; background: gold; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .go:disabled { background: #555; color: #888; }
    .msg { text-align: center; padding: 10px; }
    
    .wcard { background: linear-gradient(135deg, #1565c0, #0d47a1); margin: 15px; padding: 30px; text-align: center; border-radius: 15px; }
    .wcard .big { font-size: 40px; margin: 10px 0; }
    .wbtns { display: flex; gap: 10px; padding: 0 15px; }
    .wbtns button { flex: 1; padding: 15px; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; }
    .hist { margin: 15px; background: #222; padding: 15px; border-radius: 10px; }
    .hi { padding: 8px 0; border-bottom: 1px solid #333; }
  </style>
</head>
<body>

<div id="home" class="screen on">
  <div class="header">
    <div class="logo">JAI CLUB</div>
    <div class="bal" onclick="go('wallet')">₹ <span id="hb">500</span></div>
  </div>
  <div class="tabs">
    <div class="tab on" onclick="showCat('lottery', this)">Lottery</div>
    <div class="tab" onclick="showCat('mini', this)">Mini games</div>
    <div class="tab" onclick="showCat('popular', this)">Popular</div>
    <div class="tab" onclick="showCat('slots', this)">Slots</div>
    <div class="tab" onclick="showCat('casino', this)">Casino</div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div id="game" class="screen">
  <div class="ghead">
    <div class="back" onclick="go('home')">←</div>
    <div id="gtitle">Game</div>
    <div class="bal">₹ <span class="b">500</span></div>
  </div>
  <div class="timer" id="tm">15</div>
  <div class="msg" id="msg">चुनो</div>
  <div class="btns" id="gbtns"></div>
  <button class="go" id="goBtn" onclick="doBet()" disabled>Confirm ₹10</button>
</div>

<div id="wallet" class="screen">
  <div class="header"><div class="logo">Wallet</div></div>
  <div class="wcard">
    <div>Balance</div>
    <div class="big">₹ <span id="wb">500</span></div>
  </div>
  <div class="wbtns">
    <button style="background:#4caf50" onclick="add(100)">+100</button>
    <button style="background:#4caf50" onclick="add(500)">+500</button>
    <button style="background:#f44336" onclick="sub(100)">-100</button>
  </div>
  <div class="hist" id="hist"><div class="hi">खाली</div></div>
</div>

<div class="nav">
  <div class="on" onclick="go('home')" id="nh">🏠<br>Home</div>
  <div onclick="go('wallet')" id="nw">💰<br>Wallet</div>
  <div>🎁<br>Activity</div>
  <div>👤<br>Me</div>
</div>

<script>
let money = 500;
let cat = 'lottery';
let gname = '';
let pick = null;
let iv = null;

const data = {
  lottery: [
    {n:'WinGo', i:'🎯', opts:['Green','Violet','Red'], c:['#4caf50','#9c27b0','#f44336']},
    {n:'K3', i:'🎲', opts:['Big','Small'], c:['#2196f3','#ff9800']},
    {n:'5D', i:'🔢', opts:['Even','Odd'], c:['#009688','#673ab7']}
  ],
  mini: [
    {n:'Mines', i:'💣', opts:['Safe','Risk'], c:['#4caf50','#f44336']},
    {n:'Dice', i:'🎲', opts:['High','Low'], c:['#2196f3','#ff9800']},
    {n:'Plinko', i:'⚪', opts:['Drop'], c:['#ffd700']}
  ],
  popular: [
    {n:'Aviator', i:'✈️', opts:['CashOut'], c:['#ff5722']},
    {n:'Crash', i:'📈', opts:['CashOut'], c:['#e91e63']},
    {n:'Limbo', i:'🎯', opts:['Play'], c:['#9c27b0']}
  ],
  slots: [
    {n:'Classic', i:'🎰', opts:['Spin'], c:['#ffd700']},
    {n:'Fruit', i:'🍒', opts:['Spin'], c:['#ff5722']},
    {n:'Diamond', i:'💎', opts:['Spin'], c:['#00bcd4']}
  ],
  casino: [
    {n:'Baccarat', i:'🃏', opts:['Player','Banker'], c:['#2196f3','#f44336']},
    {n:'Roulette', i:'🎡', opts:['Red','Black'], c:['#f44336','#333']},
    {n:'Poker', i:'♠️', opts:['Call','Fold'], c:['#4caf50','#757575']}
  ]
};

function upd() {
  document.querySelectorAll('.b, #hb, #wb').forEach(e => e.textContent = money);
}

function showCat(c, el) {
  cat = c;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  el.classList.add('on');
  draw();
}

function draw() {
  const g = document.getElementById('grid');
  g.innerHTML = '';
  data[cat].forEach(item => {
    const d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = '<div class="ico">' + item.i + '</div><div>' + item.n + '</div>';
    d.onclick = () => openG(item);
    g.appendChild(d);
  });
}

function openG(item) {
  gname = item.n;
  pick = null;
  document.getElementById('gtitle').textContent = item.n;
  document.getElementById('msg').textContent = 'चुनो';
  document.getElementById('goBtn').disabled = true;
  
  const b = document.getElementById('gbtns');
  b.innerHTML = '';
  item.opts.forEach((o, i) => {
    const btn = document.createElement('button');
    btn.textContent = o;
    btn.style.background = item.c[i];
    btn.onclick = () => {
      pick = o;
      document.querySelectorAll('#gbtns button').forEach(x => x.style.outline = 'none');
      btn.style.outline = '3px solid gold';
      document.getElementById('goBtn').disabled = false;
    };
    b.appendChild(btn);
  });
  
  go('game');
  startT();
}

function startT() {
  let t = 15;
  document.getElementById('tm').textContent = t;
  if (iv) clearInterval(iv);
  iv = setInterval(() => {
    t--;
    document.getElementById('tm').textContent = t;
    if (t <= 0) {
      clearInterval(iv);
      endRound();
    }
  }, 1000);
}

function doBet() {
  if (money < 10) { alert('पैसे कम!'); return; }
  money -= 10;
  upd();
  document.getElementById('msg').textContent = 'Bet: ' + pick;
  document.getElementById('goBtn').disabled = true;
  addH(gname + ': ' + pick + ' (-10)');
}

function endRound() {
  const item = data[cat].find(x => x.n === gname);
  if (!item) return;
  const res = item.opts[Math.floor(Math.random() * item.opts.length)];
  
  if (pick === res || item.opts.length === 1) {
    const w = item.opts.length === 1 ? 15 : 20;
    money += w;
    upd();
    document.getElementById('msg').textContent = 'जीत! +' + w;
    addH(gname + ' जीत +' + w);
  } else {
    document.getElementById('msg').textContent = 'Result: ' + res;
    addH(gname + ' हार');
  }
  pick = null;
  setTimeout(() => {
    if (document.getElementById('game').classList.contains('on')) startT();
  }, 2000);
}

function go(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  document.querySelectorAll('.nav div').forEach(n => n.classList.remove('on'));
  if (id === 'home') document.getElementById('nh').classList.add('on');
  if (id === 'wallet') document.getElementById('nw').classList.add('on');
  if (iv && id !== 'game') clearInterval(iv);
}

function add(a) { money += a; upd(); addH('+' + a); }
function sub(a) { if (money >= a) { money -= a; upd(); addH('-' + a); } else alert('कम'); }

function addH(t) {
  const h = document.getElementById('hist');
  if (h.children[0]?.textContent === 'खाली') h.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'hi';
  d.textContent = t;
  h.insertBefore(d, h.firstChild);
}

upd();
draw();
</script>

</body>
</html>
