<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jai Club Demo - सीखने के लिए</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #0f1419; color: #fff; }
    
    /* Top Bar */
    .topbar {
      background: #1a1f2e;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a3040;
    }
    .logo { font-size: 20px; font-weight: bold; color: #ffd700; }
    .top-links a { color: #aaa; text-decoration: none; margin-left: 15px; font-size: 14px; }
    .top-links a:hover { color: #fff; }

    /* Bottom Navigation (जैसा असली साइट में होता है) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1a1f2e;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-top: 1px solid #2a3040;
    }
    .bottom-nav div {
      text-align: center;
      cursor: pointer;
      font-size: 12px;
      color: #888;
    }
    .bottom-nav div.active { color: #ffd700; }
    .bottom-nav div span { display: block; font-size: 20px; margin-bottom: 2px; }

    /* Pages */
    .page { display: none; padding: 20px; padding-bottom: 80px; }
    .page.active { display: block; }

    /* Home */
    .banner {
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 20px;
    }
    .game-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .game-card {
      background: #1e2533;
      padding: 20px 10px;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
    }
    .game-card:hover { background: #252d3d; }
    .game-card .icon { font-size: 30px; margin-bottom: 8px; }

    /* Wallet */
    .wallet-balance {
      background: linear-gradient(135deg, #1e88e5, #1565c0);
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 20px;
    }
    .wallet-balance .amount { font-size: 36px; font-weight: bold; margin: 10px 0; }
    .wallet-actions { display: flex; gap: 10px; margin-bottom: 20px; }
    .wallet-actions button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-recharge { background: #43a047; color: white; }
    .btn-withdraw { background: #e53935; color: white; }
    .quick-amounts { display: flex; gap: 8px; margin: 15px 0; flex-wrap: wrap; }
    .quick-amounts button {
      padding: 8px 16px;
      background: #2a3040;
      color: white;
      border: 1px solid #3a4050;
      border-radius: 6px;
      cursor: pointer;
    }
    .quick-amounts button:hover { background: #3a4050; }
    .history { background: #1e2533; border-radius: 10px; padding: 15px; }
    .history-item { padding: 10px 0; border-bottom: 1px solid #2a3040; font-size: 14px; }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="topbar">
    <div class="logo">JAI CLUB DEMO</div>
    <div class="top-links">
      <a href="#" onclick="showPage('home')">Home</a>
      <a href="#" onclick="showPage('wallet')">Wallet</a>
    </div>
  </div>

  <!-- ========== HOME PAGE ========== -->
  <div id="home" class="page active">
    <div class="banner">
      <h2>Welcome to Jai Club</h2>
      <p>Play Games • Win Rewards</p>
    </div>

    <h3 style="margin-bottom:12px;">Popular Games</h3>
    <div class="game-grid">
      <div class="game-card" onclick="alert('Wingo Game (Demo)')">
        <div class="icon">🎯</div>
        <div>Wingo</div>
      </div>
      <div class="game-card" onclick="alert('K3 Lottery (Demo)')">
        <div class="icon">🎲</div>
        <div>K3</div>
      </div>
      <div class="game-card" onclick="alert('Slots (Demo)')">
        <div class="icon">🎰</div>
        <div>Slots</div>
      </div>
      <div class="game-card" onclick="alert('Aviator (Demo)')">
        <div class="icon">✈️</div>
        <div>Aviator</div>
      </div>
      <div class="game-card" onclick="alert('Casino (Demo)')">
        <div class="icon">🃏</div>
        <div>Casino</div>
      </div>
      <div class="game-card" onclick="showPage('wallet')">
        <div class="icon">💰</div>
        <div>Wallet</div>
      </div>
    </div>
  </div>

  <!-- ========== WALLET PAGE ========== -->
  <div id="wallet" class="page">
    <h2 style="margin-bottom:15px;">Wallet</h2>

    <div class="wallet-balance">
      <div>Available Balance</div>
      <div class="amount">₹ <span id="balance">0</span></div>
    </div>

    <div class="wallet-actions">
      <button class="btn-recharge" onclick="showRecharge()">Recharge</button>
      <button class="btn-withdraw" onclick="showWithdraw()">Withdraw</button>
    </div>

    <!-- Recharge Section -->
    <div id="rechargeBox" style="display:none; background:#1e2533; padding:15px; border-radius:10px; margin-bottom:15px;">
      <h4>Recharge Amount</h4>
      <div class="quick-amounts">
        <button onclick="doRecharge(100)">₹100</button>
        <button onclick="doRecharge(500)">₹500</button>
        <button onclick="doRecharge(1000)">₹1000</button>
        <button onclick="doRecharge(2000)">₹2000</button>
      </div>
    </div>

    <!-- Withdraw Section -->
    <div id="withdrawBox" style="display:none; background:#1e2533; padding:15px; border-radius:10px; margin-bottom:15px;">
      <h4>Withdraw Amount</h4>
      <div class="quick-amounts">
        <button onclick="doWithdraw(100)">₹100</button>
        <button onclick="doWithdraw(500)">₹500</button>
        <button onclick="doWithdraw(1000)">₹1000</button>
      </div>
    </div>

    <div class="history">
      <h4>Recent Transactions</h4>
      <div id="historyList">
        <div class="history-item">कोई ट्रांजैक्शन नहीं</div>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <div class="active" onclick="showPage('home')" id="nav-home">
      <span>🏠</span>Home
    </div>
    <div onclick="showPage('wallet')" id="nav-wallet">
      <span>💰</span>Wallet
    </div>
    <div onclick="alert('Activity Page (Demo)')">
      <span>🎁</span>Activity
    </div>
    <div onclick="alert('Account Page (Demo)')">
      <span>👤</span>Account
    </div>
  </div>

  <script>
    // ========== Page Navigation ==========
    function showPage(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(page).classList.add('active');

      document.querySelectorAll('.bottom-nav div').forEach(n => n.classList.remove('active'));
      if (page === 'home') document.getElementById('nav-home').classList.add('active');
      if (page === 'wallet') document.getElementById('nav-wallet').classList.add('active');
    }

    // ========== Wallet Logic ==========
    let balance = 0;

    function updateBalance() {
      document.getElementById('balance').innerText = balance.toLocaleString('en-IN');
    }

    function showRecharge() {
      document.getElementById('rechargeBox').style.display = 'block';
      document.getElementById('withdrawBox').style.display = 'none';
    }

    function showWithdraw() {
      document.getElementById('withdrawBox').style.display = 'block';
      document.getElementById('rechargeBox').style.display = 'none';
    }

    function doRecharge(amount) {
      balance += amount;
      updateBalance();
      addHistory("Recharge +₹" + amount);
      document.getElementById('rechargeBox').style.display = 'none';
      alert("₹" + amount + " successfully added!");
    }

    function doWithdraw(amount) {
      if (balance >= amount) {
        balance -= amount;
        updateBalance();
        addHistory("Withdraw -₹" + amount);
        document.getElementById('withdrawBox').style.display = 'none';
        alert("₹" + amount + " withdrawal requested!");
      } else {
        alert("Insufficient balance!");
      }
    }

    function addHistory(text) {
      const list = document.getElementById('historyList');
      if (list.children.length === 1 && list.children[0].innerText.includes("कोई")) {
        list.innerHTML = "";
      }
      const item = document.createElement('div');
      item.className = 'history-item';
      item.innerText = text + " • " + new Date().toLocaleTimeString();
      list.insertBefore(item, list.firstChild);
    }

    updateBalance();
  </script>

</body>
</html>
