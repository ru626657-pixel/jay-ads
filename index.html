<!DOCTYPE html>
<html>
<head>
  <title>Firebase Coins</title>
  <style>
    body { font-family: Arial; max-width: 400px; margin: 50px auto; text-align: center; background: #111; color: #fff; }
    input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; border: none; border-radius: 6px; background: #6b5bff; color: white; font-weight: bold; }
    button:hover { background: #5a4ae0; }
    #app { display: none; }
  </style>
</head>
<body>

<div id="login">
  <h2>Login / Register</h2>
  <input id="email" placeholder="Email">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="register()">Register</button>
  <button onclick="login()">Login</button>
</div>

<div id="app">
  <h2>Welcome <span id="uname"></span></h2>
  <h3>Coins: <span id="coins">0</span></h3>
  <button onclick="addCoins(100)">+100 Coins</button>
  <button onclick="addCoins(500)">+500 Coins</button>
  <button onclick="logout()">Logout</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDkUrZb5HFkKG3yw80Uh30kiqoDHNHeUtY",
    authDomain: "coins-app-20bcc.firebaseapp.com",
    projectId: "coins-app-20bcc",
    storageBucket: "coins-app-20bcc.firebasestorage.app",
    messagingSenderId: "631868404343",
    appId: "1:631868404343:web:8d4acf46ee5ce65ab3cc72",
    measurementId: "G-WRX3V70BG3"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  window.register = async () => {
    const email = document.getElementById('email').value;
    const pass = document.getElementById('pass').value;
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await setDoc(doc(db, "users", cred.user.uid), {
        email: email,
        coins: 1000
      });
      alert("Registered successfully!");
    } catch (e) {
      alert(e.message);
    }
  };

  window.login = async () => {
    const email = document.getElementById('email').value;
    const pass = document.getElementById('pass').value;
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch (e) {
      alert(e.message);
    }
  };

  window.logout = () => signOut(auth);

  window.addCoins = async (amount) => {
    const user = auth.currentUser;
    if (!user) return;
    const ref = doc(db, "users", user.uid);
    const snap = await getDoc(ref);
    const newCoins = (snap.data().coins || 0) + amount;
    await updateDoc(ref, { coins: newCoins });
    document.getElementById('coins').textContent = newCoins;
  };

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      document.getElementById('login').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('uname').textContent = user.email;
      const snap = await getDoc(doc(db, "users", user.uid));
      document.getElementById('coins').textContent = snap.data()?.coins || 0;
    } else {
      document.getElementById('login').style.display = 'block';
      document.getElementById('app').style.display = 'none';
    }
  });
</script>
</body>
</html>
